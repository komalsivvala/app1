name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  config-gate:
    name: Exam config (G-CONFIG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` on purpose: G-CONFIG has zero dependencies so it keeps
      # gating the exam format even if the app's install is broken, and it
      # gated the format before the app existed at all.
      - name: Validate exam-config.json (G-CONFIG)
        run: node scripts/validate-exam-config.mjs

      - name: Validate content-config.json (G-LANG)
        run: node scripts/validate-content-config.mjs

      # `node --test <dir>` is broken on Node 22.22 (it tries to execute the
      # directory as a test file). The glob form works; do not "simplify" it.
      - name: Gate tests
        run: node --test "scripts/**/*.test.mjs"

  pipeline-lint:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile every pipeline stage
        run: python3 -m compileall -q pipeline/

      - name: Pipeline unit + ID-stability tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r pipeline/requirements.txt
          .venv/bin/python pipeline/test_pipeline.py

      - name: Content gates
        run: |
          .venv/bin/python pipeline/02_ingest_csv.py \
            pipeline/raw/supplied/LLR_Andhra_Pradesh.csv \
            --out pipeline/build/records.json
          # --strict: every blocking gate must pass. content-config.json says
          # which languages are required, so this is green for English-only v1
          # and turns red the moment "te" is added without Telugu content.
          .venv/bin/python pipeline/05_validate.py --strict

      - name: Emit bundle and check it is byte-identical to the committed module
        run: |
          .venv/bin/python pipeline/06_emit.py --ts-out src/content/questions.ts
          # A generated file that drifts from its generator is a silent content
          # change. Only the generatedAt timestamp is allowed to differ.
          git diff --ignore-matching-lines='generatedAt\|generated 20' --exit-code src/content/questions.ts pipeline/id-map.json

  app:
    name: App — typecheck, lint, i18n, unit, component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:i18n
      # Pure logic on Node's own runner against real SQLite (node:sqlite).
      - run: npm run test:node
      # Component rendering under jest-expo + RNTL.
      - run: npm run test:jest

  web-screenshots:
    name: Web export + screenshot matrix
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run export:web
      - run: npm run screenshots
        env:
          SCREENSHOT_DIR: screenshots-ci
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots-ci/

      - name: Source manifest is valid and complete
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open('pipeline/sources.json'))
          files = s['files']
          assert len(files) == 6, f"expected 6 source PDFs, found {len(files)}"
          topics = {'road-signs', 'rules-of-road-regulations', 'general-driving-principles'}
          for lang in ('en', 'te'):
              got = {f['topic'] for f in files if f['lang'] == lang}
              assert got == topics, f"{lang}: missing topics {topics - got}"
          for f in files:
              assert f['url'].startswith('https://www.aptransport.org/'), (
                  f"{f['name']} is not sourced from aptransport.org: {f['url']}"
              )
          print(f"sources.json OK — {len(files)} PDFs, 3 topics x 2 languages, all from aptransport.org")
          PY
